services:
  - type: web
    name: polkadot-bot
    runtime: node
    plan: free
    buildCommand: "npm install || true"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
